name: Build and Deploy Kintera Frontend

on:
  push:
    branches:
      - develop
      # - master
      # - main
    paths:
      - "kintera-site/**"
      - ".github/workflows/deploy-frontend.yml"

  pull_request:
    branches:
      - develop
      # - master
      # - main
    paths:
      - "kintera-site/**"
      - ".github/workflows/deploy-frontend.yml"

  workflow_dispatch:

concurrency:
  group: kintera-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: kintera-site
  IMAGE: kintera:frontend
  PREVIOUS_IMAGE: kintera:previous
  CONTAINER_NAME: kintera-frontend
  TAR_FILE: kintera-frontend.tar
  REMOTE_DIR: /var/www/kintera/frontend
  APP_PORT: "5300"

jobs:

  # ============================================
  # 1. QUALITY CHECK
  # ============================================

  quality:
    name: Quality Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kintera-site

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kintera-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        if: github.event_name == 'pull_request'
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}

  # ============================================
  # 2. BUILD + DEPLOY
  # ============================================

  deploy:
    name: Build Docker & Deploy

    needs: quality

    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/master' ||
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/develop'
        )
      )

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout code
        uses: actions/checkout@v4

      # ==========================================
      # Build Docker image
      # ==========================================

      - name: Make build script executable
        run: chmod +x "${{ env.APP_DIR }}/build-prod.sh"

      - name: Build Docker image
        working-directory: kintera-site
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
          CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}
        run: |
          ./build-prod.sh

      # ==========================================
      # Save Docker image
      # ==========================================

      - name: Save Docker image
        run: |
          docker save "${IMAGE}" -o "${TAR_FILE}"
          chmod 644 "${TAR_FILE}"

          echo "Image:"
          docker images "${IMAGE}"

          echo "Tar:"
          ls -lh "${TAR_FILE}"

      # ==========================================
      # Prepare VPS
      # ==========================================

      - name: Prepare VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          REMOTE_DIR: ${{ env.REMOTE_DIR }}

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: REMOTE_DIR

          script: |
            set -e

            mkdir -p "$REMOTE_DIR"

            echo "✅ VPS ready"

      # ==========================================
      # Upload Docker image
      # ==========================================

      - name: Upload Docker image
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: ${{ env.TAR_FILE }}
          target: "/tmp/"

      # ==========================================
      # Deploy
      # ==========================================

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2

        env:
          IMAGE: ${{ env.IMAGE }}
          PREVIOUS_IMAGE: ${{ env.PREVIOUS_IMAGE }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          TAR_FILE: ${{ env.TAR_FILE }}
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          APP_PORT: ${{ env.APP_PORT }}

          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
          CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

          envs: >-
            IMAGE,
            PREVIOUS_IMAGE,
            CONTAINER_NAME,
            TAR_FILE,
            REMOTE_DIR,
            APP_PORT,
            RESEND_API_KEY,
            CONTACT_TO_EMAIL,
            CONTACT_FROM_EMAIL

          script: |

            set -e

            cd "$REMOTE_DIR"

            echo "=========================================="
            echo "🚀 KINTERA DEPLOYMENT"
            echo "=========================================="

            # ==========================================
            # Backup image actuelle
            # ==========================================

            if docker image inspect "$IMAGE" >/dev/null 2>&1; then
              docker tag "$IMAGE" "$PREVIOUS_IMAGE"
              echo "✅ Previous image saved"
            fi

            # ==========================================
            # Load nouvelle image
            # ==========================================

            docker load -i "/tmp/$TAR_FILE"

            docker image inspect "$IMAGE" >/dev/null

            echo "✅ Image loaded"

            # ==========================================
            # Stop ancien container
            # ==========================================

            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true

            # ==========================================
            # Start nouveau container
            # ==========================================

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --init \
              -p "127.0.0.1:${APP_PORT}:3000" \
              -e NODE_ENV=production \
              -e RESEND_API_KEY="$RESEND_API_KEY" \
              -e CONTACT_TO_EMAIL="$CONTACT_TO_EMAIL" \
              -e CONTACT_FROM_EMAIL="$CONTACT_FROM_EMAIL" \
              "$IMAGE"

            # ==========================================
            # Health check
            # ==========================================

            echo "🩺 Checking Kintera..."

            OK=0

            for i in $(seq 1 30); do

              if curl \
                --fail \
                --silent \
                "http://127.0.0.1:${APP_PORT}/api/health" \
                >/dev/null 2>&1
              then
                OK=1
                echo "✅ Kintera is online"
                break
              fi

              echo "⏳ Waiting $i/30..."
              sleep 3

            done

            # ==========================================
            # Rollback
            # ==========================================

            if [ "$OK" -ne 1 ]; then

              echo "❌ Deployment failed"

              docker logs \
                --tail 100 \
                "$CONTAINER_NAME" || true

              docker stop "$CONTAINER_NAME" || true
              docker rm "$CONTAINER_NAME" || true

              if docker image inspect "$PREVIOUS_IMAGE" >/dev/null 2>&1; then

                echo "↩️ Rolling back..."

                docker run -d \
                  --name "$CONTAINER_NAME" \
                  --restart unless-stopped \
                  --init \
                  -p "127.0.0.1:${APP_PORT}:3000" \
                  -e NODE_ENV=production \
                  -e RESEND_API_KEY="$RESEND_API_KEY" \
                  -e CONTACT_TO_EMAIL="$CONTACT_TO_EMAIL" \
                  -e CONTACT_FROM_EMAIL="$CONTACT_FROM_EMAIL" \
                  "$PREVIOUS_IMAGE"

                echo "✅ Previous version restored"

              else

                echo "⚠️ No previous version available"

              fi

              rm -f "/tmp/$TAR_FILE"

              exit 1
            fi

            # ==========================================
            # Cleanup
            # ==========================================

            rm -f "/tmp/$TAR_FILE"

            docker image prune -f >/dev/null 2>&1 || true

            echo "=========================================="
            echo "🎉 KINTERA DEPLOYMENT SUCCESSFUL"
            echo "=========================================="

            docker ps --filter "name=$CONTAINER_NAME"